<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="CWA, Form, Help Desk, Appointment, HTML,Swinburne,University">
    <meta name="author" content="A struggling student, Ryan Stothard">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
    <a href="https://www.swin.edu.au"><img src="images/logo.png" alt="Swinburne Logo"></a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    
    <fieldset>
        <legend>Student Details</legend>
        <p><label for="studentID">Student ID</label>
            <input type="text" name="studentID" id="studentID" pattern="[0-9]{7,10}" required="required">
        </p>
        <p><label for="givenName">Given Name</label>
            <input type="text" name="givenName" id="givenName" pattern="[A-Za-z]{2,15}" required="required">
            <label for="familyName">Family Name</label>
            <input type="text" name="familyName" id="familyName" pattern="[A-Za-z]{2,15}" required="required">
        </p>
    </fieldset>
    


        <fieldset>
        <legend>Your Unit</legend>
        <p>
            <input type="radio" id="COS10011" name="unit" value="COS10011" required="required">
            <label for="COS10011">COS10011</label>
            
            <input type="radio" id="COS60004" name="unit" value="COS60004">
            <label for="COS60004">COS60004</label>
            
            <input type="radio" id="COS60007" name="unit"  value="COS60007">
            <label for="COS60007">COS60007</label>
        </p>
        <p>
            <label for="tutors">Your Tutor</label>
            <select name="tutors" id="tutors" required="required">
                <option value="">Please Select</option>
                <option value="tutor1">Tutor 1</option>
                <option value="tutor2">Tutor 2</option>
                <option value="tutor3">Tutor 3</option>
            </select>
        </p>
        </fieldset>
    

    
        <fieldset>
            <legend>Issue</legend>
            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="language" checked="checked">
                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="language">
                <label for="javascript">JavaScript</label>
                <input type="checkbox" id="javascript" name="language">
                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="language">
                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="language">
            </p>
            <p>
                <label for="description">Description of Issue</label>
                <br>
                <textarea name="description" id="description" rows="5" cols="50" placeholder="Write description of your problem here..." required="required"></textarea>
            </p>
            
        </fieldset>
    
    
        <fieldset>
            <legend>Preferred Date/Time</legend>
            <p>
                <label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" required="required" pattern="[0-3]{1}[0-9]{1}/[0-1]{1}[0-9]{1}/[0-9]{4}">
            </p>
            <p>
                <label for="time">Time</label>
                <input type="text" name="time" id="time" placeholder="00:00" required="required" pattern="[0-2]{1}[0-9]{1}:[0-5]{1}[0-9]{1}">
            </p>
        </fieldset>
        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    
</form>
</body>
</html>
